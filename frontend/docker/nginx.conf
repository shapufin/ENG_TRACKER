server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # P2-9: Security headers are set in the location blocks below, NOT at
    # the server level. This prevents duplicate headers on /api/ and
    # /media/ responses, which are proxied to Django (Django's
    # SecurityMiddleware sets the same headers).

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache hashed assets aggressively (Vite uses content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # P2-9: security headers for static assets
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes
    # P2-9: security headers here (not at server level) to avoid
    # duplicates on proxied /api/ responses where Django also sets them.
    location / {
        # Security headers (P0-1 CSP, P2-6 referrer, P2-8 XSS, P2-9 no dupes)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP report-only (P0-1): collect violations before enforcing.
        # Allows service worker ('self' covers /sw.js), Vite module preload
        # (inline script), web push endpoints, and data/blob images.
        # Switch to enforcing (drop -Report-Only) after ~1 week of clean reports.
        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; "
            "script-src 'self'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: blob:; "
            "connect-src 'self' https://fcm.googleapis.com https://push.services.mozilla.com https://updates.push.services.mozilla.com; "
            "manifest-src 'self'; "
            "worker-src 'self'; "
            "frame-ancestors 'none'; "
            "object-src 'none'; "
            "base-uri 'self'; "
            "form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) X-Forwarded-For with the real client IP.
        # $proxy_add_x_forwarded_for appends to any client-supplied XFF,
        # allowing throttle bypass via unique spoofed XFF values (P1-9).
        # With $remote_addr, the only XFF entry is the real client IP.
        # If a Cloudflare/ALB layer is added in front, switch back to
        # $proxy_add_x_forwarded_for and set DRF NUM_PROXIES=2.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy media files to backend (Django serves media in dev; in prod
    # a CDN or S3 is preferred, but this keeps the stack self-contained).
    # P0-3 step 4: defense-in-depth headers — even if the backend view
    # failed to set them, nginx forces download + nosniff so uploaded
    # files (including legacy .html evidence) can never render inline.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
    }
}
