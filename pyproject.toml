[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pins the rule set ruff was already enforcing implicitly (its defaults:
# E4/E7/E9 pycodestyle subset + F pyflakes) as an explicit, checked-in
# config instead of relying on whatever ruff ships as "default" in future
# versions. `ruff check` passed clean under these before this file existed.
#
# A stricter set (B, UP, SIM, DJ) was evaluated and currently surfaces
# ~680 findings across apps/core/config/plugins - too large to fix as part
# of this pass without real risk of behavior changes. Adopting it is a
# separate, dedicated follow-up (see backend review notes), not bundled
# here.
select = ["E4", "E7", "E9", "F"]
