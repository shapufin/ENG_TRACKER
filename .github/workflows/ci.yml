name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # The Prettier step below diffs against the base ref, which needs
          # history the default depth=1 checkout does not carry.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high+ vulnerabilities)
        run: npm audit --audit-level=high
      - name: Plugin service URL guard
        run: |
          # Catch doubled /api/api/ bug: axios baseURL already includes /api,
          # so service files must NOT use /api/ prefix in api.get/post/etc.
          if grep -rnE "api\.(get|post|patch|delete|put)\(['\"]/api/" src/; then
            echo "::error::Service file uses /api/ prefix in api call — axios baseURL already includes /api. Use /plugins/<name> or /<app>/ instead."
            exit 1
          fi
      # Prettier runs on CHANGED files only. The repo carries ~425 files of
      # pre-existing drift across every agent's zone, and reformatting all of
      # them in one pass would rewrite files this workflow does not own while
      # several workers are active. Checking the diff keeps new code formatted
      # and reformats each file incrementally as it is next touched; a
      # coordinated one-shot cleanup can retire this narrowing later.
      - name: Prettier check (changed files)
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [ -n "${BEFORE}" ]; then RANGE="${BEFORE}...HEAD"; else RANGE=""; fi
          fi
          if [ -z "${RANGE}" ]; then
            echo "No base commit to diff against — skipping Prettier."
            exit 0
          fi
          # --relative: this job runs with working-directory: frontend, but
          # plain `git diff --name-only` prints repo-root paths
          # (frontend/src/...), which prettier would reject from here with
          # "No files matching the pattern were found".
          mapfile -t files < <(git diff --name-only --relative --diff-filter=ACMR "${RANGE}" -- src \
            | grep -E '\.(ts|tsx|js|jsx|json|css|md)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No formattable src files changed in ${RANGE} — skipping Prettier."
            exit 0
          fi
          echo "Checking ${#files[@]} changed file(s):"
          printf '  %s\n' "${files[@]}"
          npx prettier --check "${files[@]}"
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc -b --noEmit
      - name: Table header contract
        run: node --test scripts/table-header-audit.test.mjs && node scripts/table-header-audit.mjs
      # --exclude: src/plugins/engagement still carries a raw search input/select; drop the flag once it migrates.
      - name: Control kit contract
        run: node --test scripts/control-audit.test.mjs && node scripts/control-audit.mjs --strict
      - name: Surface contract
        run: node --test scripts/surface-audit.test.mjs && node scripts/surface-audit.mjs --strict
      # Static source scans (no browser, no server). Phase 8.1 / CI-03.
      - name: Modal contract
        run: node scripts/modal-audit.mjs && node scripts/modal-visual-audit.mjs
      - name: Dashboard contract
        run: node scripts/dashboard-audit.mjs
      - name: Visual tooling tests
        run: node --test scripts/visual-fingerprint.test.mjs scripts/visual-route-manifest.test.mjs scripts/visual-capture-helpers.test.mjs scripts/admin-routes.test.mjs
      - name: Build
        run: npm run build
      # Needs dist/ from the build step above.
      - name: Entry chunk audit
        run: node scripts/entry-chunk-audit.mjs
      - name: Tests with coverage
        run: npm test -- --run --coverage
      # --report-only: the tree carries 154 functions over the default
      # complexity limits (702-line dialogs, 532-line pages) spread across
      # every zone, so a findings gate cannot pass without a refactor pass
      # nobody has scheduled. The score and every finding still print in the
      # log; the step just does not block. Configured thresholds
      # (health.max*) would only move the number, and --min-score still
      # exits 1 on findings in fallow 2.91.0 despite its help text.
      - name: Fallow health (with runtime coverage)
        run: |
          # --runtime-coverage needs the fallow-cov sidecar binary, which
          # `npx fallow` does not pull in automatically (only the fallow
          # CLI itself). Install it explicitly so this step works on a
          # fresh CI runner, not just a dev machine that happened to have
          # it cached already.
          npm install --no-save @fallow-cli/fallow-cov@latest
          npx fallow health --format json --quiet --runtime-coverage coverage/coverage-final.json --report-only
      - name: Fallow dead-code
        run: npx fallow dead-code --format json --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-production.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-production.txt is needed here too: the deployment
          # check below runs with --settings=config.settings_production,
          # which requires psycopg2 (django-redis, etc. are importable
          # without a real Postgres/Redis backend, so this is safe for CI).
          pip install -r requirements.txt -r requirements-production.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check apps core config plugins
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Django deployment check
        run: python manage.py check --deploy --settings=config.settings_production
        env:
          SECRET_KEY: ci-deploy-check-secret-key-that-is-long-enough-for-django-check-50chars
          MFA_ENCRYPTION_KEYS: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
          ALLOWED_HOSTS: localhost
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          USE_REDIS: "true"
          FRONTEND_URL: http://localhost
      - name: Test (all apps + plugins)
        run: python manage.py test -v 1

  # Same suite as `backend`, on the database production runs (CI-02, Phase 8.2).
  # continue-on-error is TEMPORARY and exists only for this PR (Phase 8 CI
  # hardening, docs/superpowers/plans/2026-10-14-production-readiness.md): the
  # suite has only ever run on SQLite, so the first Postgres run may expose
  # SQLite-only test assumptions (known candidate: the sqlite_master query in
  # plugins/organigrama/tests/test_models.py). Remove this flag once the first
  # run has been read and each failure fixed or recorded; a red job here must
  # not be ignored after that.
  backend-postgres:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-production.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-production.txt carries psycopg2-binary (Linux wheel).
          pip install -r requirements.txt -r requirements-production.txt -r requirements-dev.txt
      - name: Test (all apps + plugins, PostgreSQL)
        run: python manage.py test -v 1 --settings=config.settings_ci_pg

  # Playwright against the real dev servers (CI-01, Phase 8.3). The webServer
  # block in frontend/playwright.config.ts starts Django (settings_e2e, its own
  # SQLite file) and Vite; reuseExistingServer is off when CI is set.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: config.settings_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Plugin URLs are computed at server start, so migrate, enable plugins and
      # seed BEFORE the servers launch.
      - name: Prepare e2e database
        run: python manage.py prepare_e2e_db --settings=config.settings_e2e
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium --reporter=github,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # CI-04: scan both images; CRITICAL fails the job, HIGH is reported.
  # ignore-unfixed hides findings with no upstream fix (nothing to act on).
  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t engtracker-backend .
      - name: Build frontend image
        run: docker build -t engtracker-frontend ./frontend
      - name: Trivy report HIGH and CRITICAL (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: engtracker-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy gate CRITICAL (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: engtracker-backend
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy report HIGH and CRITICAL (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: engtracker-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy gate CRITICAL (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: engtracker-frontend
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # CI-05: secrets in history. The allow-list lives in .gitleaks.toml.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  # CI-05: deployment files parse. No secrets: the env file is written into the
  # runner's temp directory and never committed.
  deploy-config:
    name: Deploy config (compose + nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          {
            echo "SECRET_KEY=ci-compose-config-key-not-a-secret-long-enough-for-validation"
            echo "ALLOWED_HOSTS=localhost"
            echo "FRONTEND_URL=http://localhost"
            echo "DB_PASSWORD=ci-dummy"
            echo "REDIS_PASSWORD=ci-dummy"
            echo "MFA_ENCRYPTION_KEYS=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="
          } > "$RUNNER_TEMP/compose-ci.env"
          docker compose --env-file "$RUNNER_TEMP/compose-ci.env" config -q
      # The official nginx entrypoint renders /etc/nginx/templates/*.template with
      # envsubst before running the command, exactly as in the frontend image.
      # `backend` is mapped to loopback only so `nginx -t` can resolve the
      # proxy_pass host; default.conf is removed like the Dockerfile does.
      - name: nginx -t (ONLYOFFICE_ORIGIN set)
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -e ONLYOFFICE_ORIGIN=https://docs.example.com \
            -e INGRESS_TRUSTED_CIDR=172.28.0.0/24 -e INGRESS_REAL_IP_HEADER=CF-Connecting-IP \
            -v "$PWD/frontend/docker/nginx.conf.template:/etc/nginx/templates/app.conf.template:ro" \
            --entrypoint sh nginx:1.27-alpine-slim \
            -c 'rm -f /etc/nginx/conf.d/default.conf && /docker-entrypoint.sh nginx -t'
      - name: nginx -t (ONLYOFFICE_ORIGIN empty, the image and compose default)
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -e ONLYOFFICE_ORIGIN= \
            -e INGRESS_TRUSTED_CIDR=10.0.0.5/32 -e INGRESS_REAL_IP_HEADER=X-Real-IP \
            -v "$PWD/frontend/docker/nginx.conf.template:/etc/nginx/templates/app.conf.template:ro" \
            --entrypoint sh nginx:1.27-alpine-slim \
            -c 'rm -f /etc/nginx/conf.d/default.conf && /docker-entrypoint.sh nginx -t'

  # CI-05: the production image boots against real Postgres + Redis (migrations
  # included) and answers the liveness probe.
  smoke:
    name: Backend image smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t engtracker-backend .
      # --network host: the service containers publish on the runner's loopback.
      - name: Start backend container
        run: |
          docker run -d --name smoke --network host \
            -e SECRET_KEY=ci-smoke-key-not-a-secret-long-enough-for-the-production-guard \
            -e MFA_ENCRYPTION_KEYS=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg= \
            -e ALLOWED_HOSTS=localhost \
            -e FRONTEND_URL=http://localhost \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_NAME=smoke -e DB_USER=smoke -e DB_PASSWORD=smoke \
            -e USE_REDIS=true -e REDIS_URL=redis://127.0.0.1:6379/0 \
            engtracker-backend
      - name: Probe /api/health/live/
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health/live/; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::backend never answered /api/health/live/"
          exit 1
      - name: Probe /api/health/ready/
        run: curl -fsS http://localhost:8000/api/health/ready/
      - name: Container logs
        if: failure()
        run: docker logs smoke

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-production.txt -r requirements-dev.txt --strict
      - name: Install bandit
        run: pip install bandit
      - name: Bandit security lint
        run: bandit -r apps core config plugins -ll -x "*/tests/*,*/test_*.py,*/migrations/*"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t engtracker-backend .
      - name: Build frontend image
        run: docker build -t engtracker-frontend ./frontend
