name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high+ vulnerabilities)
        run: npm audit --audit-level=high
      - name: Plugin service URL guard
        run: |
          # Catch doubled /api/api/ bug: axios baseURL already includes /api,
          # so service files must NOT use /api/ prefix in api.get/post/etc.
          if grep -rnE "api\.(get|post|patch|delete|put)\(['\"]/api/" src/; then
            echo "::error::Service file uses /api/ prefix in api call — axios baseURL already includes /api. Use /plugins/<name> or /<app>/ instead."
            exit 1
          fi
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - name: Tests with coverage
        run: npm test -- --run --coverage
      - name: Fallow health (with runtime coverage)
        run: npx fallow health --format json --quiet --runtime-coverage coverage/coverage-final.json
      - name: Fallow dead-code
        run: npx fallow dead-code --format json --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff check
        run: ruff check apps core config plugins
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Django deployment check
        run: python manage.py check --deploy --settings=config.settings_production
        env:
          SECRET_KEY: ci-deploy-check-secret-key-that-is-long-enough-for-django-check-50chars
          ALLOWED_HOSTS: localhost
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          USE_REDIS: "true"
          FRONTEND_URL: http://localhost
          ENABLE_API_DOCS: "False"
      - name: Test (all apps + plugins)
        run: python manage.py test -v 1

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-production.txt -r requirements-dev.txt --strict
      - name: Install bandit
        run: pip install bandit
      - name: Bandit security lint
        run: bandit -r apps core config plugins -ll -x "*/tests/*,*/test_*.py,*/migrations/*"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t engtracker-backend .
      - name: Build frontend image
        run: docker build -t engtracker-frontend ./frontend
