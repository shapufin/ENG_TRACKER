name: Security weekly

# Dependency advisories appear without any commit, so audit on a schedule as
# well as on demand. Failures here mean a new advisory, not a code change.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-production.txt -r requirements-dev.txt --strict

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high+ vulnerabilities)
        run: npm audit --audit-level=high
