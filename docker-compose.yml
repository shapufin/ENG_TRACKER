# Production Docker Compose for Engineering Tracker
#
# Usage:
#   docker compose up -d
#
# Required environment variables (set in .env or shell):
#   SECRET_KEY - Django secret key (use: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")
#   ALLOWED_HOSTS - comma-separated list of allowed hosts
#   FRONTEND_URL - public URL of the frontend (for CORS)
#   DB_NAME, DB_USER, DB_PASSWORD - PostgreSQL credentials
#   REDIS_PASSWORD - Redis password (required for production)
#   MFA_ENCRYPTION_KEYS - Fernet key(s) for two-factor seeds (python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY - Web Push keys (python -m py_vapid generate)
#
# Optional:
#   EMAIL_HOST, EMAIL_PORT, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD
#   DB_SSL_MODE - PostgreSQL SSL mode (default: prefer)
#   DB_CONN_MAX_AGE - seconds a DB connection is kept open per worker (default: 60)
#   GUNICORN_WORKERS - sync workers per backend container (default: 3). Each
#     worker holds one DB connection and loads pandas; the container CPU limit is 1.0.
#   RUN_MIGRATIONS - 1 (default) runs migrate + boot-time reconciliation on start.
#     With several backend replicas set it to 0 on all but one (see docker/entrypoint.sh).
#   BACKUP_INTERVAL_SECONDS, BACKUP_RETENTION - db-backup schedule and how many
#     DB dumps and media archives to keep (defaults: 86400, 7)
#
# Ingress: this file ships no TLS terminator or tunnel. Put an external reverse
# proxy (or a Cloudflare Tunnel connector) in front of the `frontend` service,
# see README.md -> Production Deployment -> Ingress for the requirements.

name: engineering-tracker

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-engtracker}
      POSTGRES_USER: ${DB_USER:-engtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
    # No port published — only accessible within the backend network
    security_opt:
      - no-new-privileges:true
    # P1-6: resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # P1-5: Redis password required in production
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      # P1-5: healthcheck must authenticate with the password
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Fernet key(s) that encrypt two-factor seeds, comma separated (first encrypts, all
      # decrypt). Carry it to any new server with SECRET_KEY; losing it locks out enrolled users.
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?MFA_ENCRYPTION_KEYS is required}
      ONLYOFFICE_DOCUMENT_SERVER_URL: ${ONLYOFFICE_DOCUMENT_SERVER_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      USE_REDIS: "true"
      # P1-5: Redis URL includes password
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-engtracker}
      DB_USER: ${DB_USER:-engtracker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # P1-10: Database SSL — use 'prefer' by default, 'require' for managed DBs
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      # DEP-04: persistent DB connections (seconds). Replicas x GUNICORN_WORKERS
      # connections must stay below Postgres max_connections (default 100).
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      # DEP-13: sync gunicorn workers; the Dockerfile CMD reads this.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # DEP-06: set to 0 on every backend replica except the one that migrates.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # Leave unset to auto-invalidate cache on every rebuild via the image's
      # baked BUILD_ID (see Dockerfile/entrypoint.sh). Set CACHE_VERSION here
      # only to force a manual bump without rebuilding.
      CACHE_VERSION: ${CACHE_VERSION:-}
      # Optional: bootstraps the initial superuser on first start (see ensure_superuser command).
      # Safe to leave set — no-ops once the user exists.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      # CSP allowlist entry for the onboarding plugin's OnlyOffice document
      # editor (script-src/connect-src/frame-src in nginx.conf.template) —
      # the ORIGIN only (scheme://host[:port], no path), e.g.
      # https://office.example.com. Leave unset/empty if OnlyOffice isn't
      # configured (ONLYOFFICE_DOCUMENT_SERVER_URL on the backend service,
      # below) — the CSP directive simply omits it.
      ONLYOFFICE_ORIGIN: ${ONLYOFFICE_ORIGIN:-}
      # Ingress trust boundary: the network your reverse proxy reaches nginx from
      # (one CIDR) and the header it sets with the real client IP. Without a match
      # every user shares the proxy's address and one /api/ rate-limit bucket.
      # Host proxy via the published port: the bridge gateway, e.g. 172.28.0.1/32.
      INGRESS_TRUSTED_CIDR: ${INGRESS_TRUSTED_CIDR:-172.28.0.0/24}
      INGRESS_REAL_IP_HEADER: ${INGRESS_REAL_IP_HEADER:-CF-Connecting-IP}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Bound to localhost only: the external reverse proxy (or tunnel connector)
    # running on this host reaches nginx through this port, or over frontend_net
    # by service name (http://frontend:8080) when it is a container on that
    # network. Publishing it to 0.0.0.0 would let anyone bypass the proxy's TLS
    # and edge protections and hit the origin directly. Kept bound to 127.0.0.1
    # so `curl localhost:8080` still works for local health checks/debugging.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # No ingress service is defined here (the Cloudflare Tunnel connector was
  # removed). Terminate TLS in an external reverse proxy, or run a tunnel
  # connector (cloudflared) yourself, pointing at http://frontend:8080 on
  # frontend_net or at 127.0.0.1:${FRONTEND_PORT:-8080} on the host. Required
  # forwarded headers, the real-client-IP header and the trusted subnet are
  # documented in README.md -> Production Deployment -> Ingress.

  # DEP-07: scheduled backups. Start once with
  #   docker compose --profile backup up -d db-backup
  # It then loops forever: every BACKUP_INTERVAL_SECONDS (default 86400 = daily)
  # it writes, into the db_backup volume,
  #   engtracker_YYYY-MM-DD_HHMMSS.dump   custom-format pg_dump -Fc of the database
  #   media_YYYY-MM-DD_HHMMSS.tar.gz      tar of the media_files volume (read-only mount)
  # and keeps the newest BACKUP_RETENTION (default 7) of each kind. Old files are
  # pruned only after the new one was written successfully. Set BACKUP_ONCE=1
  # for a single run (`docker compose --profile backup run --rm -e BACKUP_ONCE=1
  # db-backup`). The volume lives on the same host: copy it offsite to an
  # encrypted location, and follow docs/deploy/production-runbook.md to restore.
  db-backup:
    image: postgres:16
    profiles: ["backup"]  # not started by `docker compose up`
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USER:-engtracker}
      PGDATABASE: ${DB_NAME:-engtracker}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_ONCE: ${BACKUP_ONCE:-0}
    volumes:
      - db_backup:/backups
      - media_files:/media:ro
    # `$$` is compose's escape for a literal `$` that the shell expands.
    entrypoint: ["sh", "-c"]
    command:
      - |
        interval="$${BACKUP_INTERVAL_SECONDS:-86400}"
        keep="$${BACKUP_RETENTION:-7}"
        while true; do
          ts="$$(date +%Y-%m-%d_%H%M%S)"
          if pg_dump -Fc -f "/backups/engtracker_$$ts.dump.part"; then
            mv "/backups/engtracker_$$ts.dump.part" "/backups/engtracker_$$ts.dump"
            ls -1t /backups/engtracker_*.dump | tail -n +"$$((keep + 1))" | xargs -r rm -f
            echo "[db-backup] database dump engtracker_$$ts.dump written"
          else
            rm -f "/backups/engtracker_$$ts.dump.part"
            echo "[db-backup] database dump FAILED, keeping existing backups" >&2
          fi
          # tar exits 1 when a file changed while it was read (users uploading
          # during the run); the archive is still usable. 2+ is a real failure.
          tar -czf "/backups/media_$$ts.tar.gz.part" -C /media .; rc=$$?
          if [ "$$rc" -le 1 ]; then
            mv "/backups/media_$$ts.tar.gz.part" "/backups/media_$$ts.tar.gz"
            ls -1t /backups/media_*.tar.gz | tail -n +"$$((keep + 1))" | xargs -r rm -f
            echo "[db-backup] media archive media_$$ts.tar.gz written"
          else
            rm -f "/backups/media_$$ts.tar.gz.part"
            echo "[db-backup] media archive FAILED, keeping existing backups" >&2
          fi
          if [ "$${BACKUP_ONCE:-0}" = "1" ]; then exit 0; fi
          sleep "$$interval"
        done
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  db_backup:

networks:
  # P1-5: network segmentation
  # backend_net: db + redis + backend only (no frontend access)
  # frontend_net: frontend + backend only (no db/redis access)
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
    # Fixed subnet so nginx's set_real_ip_from (frontend/docker/nginx.conf.template)
    # can trust exactly this network's members (frontend, backend,
    # cloudflared) — not a Docker-assigned range that could shift on
    # recreate, and not the whole private address space.
    ipam:
      config:
        - subnet: 172.28.0.0/24
